65" y="448" width="330" height="38" fill="#fff" stroke="#777" /><text x="77" y="473" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ sq m / m / kg / L / each ]</text><text x="425" y="440" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Unit cost in USD</text><rect x="425" y="448" width="330" height="38" fill="#fff" stroke="#777" /><text x="437" y="473" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Nonnegative amount ]</text><text x="65" y="515" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Starting quantity on hand</text><rect x="65" y="523" width="330" height="38" fill="#fff" stroke="#777" /><text x="77" y="548" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Amount &gt;= 0 ]</text><text x="425" y="515" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Reorder level</text><rect x="425" y="523" width="330" height="38" fill="#fff" stroke="#777" /><text x="437" y="548" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Low-stock threshold &gt;= 0 ]</text><text x="65" y="590" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Most recent purchase date (optional)</text><rect x="65" y="598" width="330" height="38" fill="#fff" stroke="#777" /><text x="77" y="623" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Date, not in the future ]</text><text x="425" y="590" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Recorded by</text><rect x="425" y="598" width="330" height="38" fill="#fff" stroke="#777" /><text x="437" y="623" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Select employee ]</text><rect x="800" y="270" width="330" height="400" fill="#f1f1f1" stroke="#777" /><text x="820" y="300" font-family="Arial,sans-serif" font-size="16" fill="#252525" >Status</text><text x="820" y="330" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Material status</text><rect x="820" y="338" width="285" height="38"