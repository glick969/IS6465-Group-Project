<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="WF-M03A Record stock adjustment"><rect width="100%" height="100%" fill="white"/><text x="35" y="37" font-family="Arial,sans-serif" font-size="23" fill="#252525" >WF-M03A  Record stock adjustment</text><text x="35" y="65" font-family="Arial,sans-serif" font-size="13" fill="#252525" >UC-M03 alternative • Reason and employee required • Live preview • Reject stock below zero</text><rect x="35" y="90" width="1130" height="660" fill="#fafafa" stroke="#777" /><rect x="35" y="90" width="1130" height="62" fill="#eee" stroke="#777" /><text x="60" y="128" font-family="Arial,sans-serif" font-size="18" fill="#252525" >KITTEN FACTORY</text><text x="460" y="128" font-family="Arial,sans-serif" font-size="15" fill="#252525" >Home    Products    Customer catalog    Raw materials    Login</text><text x="60" y="179" font-family="Arial,sans-serif" font-size="12" fill="#252525" >MIDTERM PROTOTYPE / FICTIONAL DATA / NO DATABASE</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="26" fill="#252525" >Edit raw material / M2003</text><text x="65" y="247" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Record a stock change. Each change is logged with its reason and employee.</text><rect x="65" y="265" width="690" height="420" fill="#fff" stroke="#777" /><text x="95" y="305" font-family="Arial,sans-serif" font-size="20" fill="#252525" >Record a stock adjustment</text><text x="95" y="335" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Quantity on hand is never typed over.</text><text x="95" y="375" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Reason for change</text><rect x="95" y="383" width="630" height="38" fill="#fff" stroke="#777" /><text x="107" y="408" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Delivery (+) / Used in production (−) / Correction (+ or −) ]</text><text x="95" y="450" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Amount</text><rect x="95" y="458" width="300" height="38" fill="#fff" stroke="#777" /><text x="107" y="483" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Positive amount ]</text><text x="425" y="450" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Recorded by</text><rect x="425" y="458" width="300" height="38" fill="#fff" stroke="#777" /><text x="437" y="483" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Select employee ]</text><text x="95" y="535" font-family="Arial,sans-serif" font-size="15" fill="#252525" >New quantity on hand: [ current ± amount ] L</text><rect x="95" y="560" width="240" height="42" fill="#e3e3e3" stroke="#777" /><text x="215.0" y="587.0" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Record adjustment</text><text x="95" y="635" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Below-zero result: show "This would reduce inventory below zero. Only 4 L is on hand."</text><text x="95" y="660" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Entries are kept so the employee can correct the amount.</text><rect x="800" y="270" width="330" height="400" fill="#f1f1f1" stroke="#777" /><text x="820" y="300" font-family="Arial,sans-serif" font-size="16" fill="#252525" >CURRENT STOCK</text><text x="820" y="350" font-family="Arial,sans-serif" font-size="32" fill="#252525" >4 L</text><text x="820" y="425" font-family="Arial,sans-serif" font-size="16" fill="#252525" >Rules</text><text x="820" y="455" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Delivery adds stock and</text><text x="820" y="480" font-family="Arial,sans-serif" font-size="14" fill="#252525" >updates the purchase date</text><text x="820" y="505" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Subtractions cannot go</text><text x="820" y="530" font-family="Arial,sans-serif" font-size="14" fill="#252525" >below 