<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="WF-M04S Stock-on-hand blocker"><rect width="100%" height="100%" fill="white"/><text x="35" y="37" font-family="Arial,sans-serif" font-size="23" fill="#252525" >WF-M04S  Stock-on-hand blocker</text><text x="35" y="65" font-family="Arial,sans-serif" font-size="13" fill="#252525" >UC-M04 A2 • Stock on hand blocks deletion • Offer inactivation</text><rect x="35" y="90" width="1130" height="660" fill="#fafafa" stroke="#777" /><rect x="35" y="90" width="1130" height="62" fill="#eee" stroke="#777" /><text x="60" y="128" font-family="Arial,sans-serif" font-size="18" fill="#252525" >KITTEN FACTORY</text><text x="460" y="128" font-family="Arial,sans-serif" font-size="15" fill="#252525" >Home    Products    Customer catalog    Raw materials    Login</text><text x="60" y="179" font-family="Arial,sans-serif" font-size="12" fill="#252525" >MIDTERM PROTOTYPE / FICTIONAL DATA / NO DATABASE</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="26" fill="#252525" >Remove raw material</text><rect x="65" y="265" width="1055" height="420" fill="#fff" stroke="#777" /><text x="95" y="305" font-family="Arial,sans-serif" font-size="22" fill="#252525" >P-Tex base material / M2004</text><text x="95" y="345" font-family="Arial,sans-serif" font-size="15" fill="#252525" >12 sq m on hand / Active</text><text x="95" y="395" font-family="Arial,sans-serif" font-size="20" fill="#252525" >Stock on hand blocks deletion</text><text x="95" y="435" font-family="Arial,sans-serif" font-size="15" fill="#252525" >No product links or history, but 12 sq m is still on hand. Permanent deletion is blocked.</text><text x="95" y="470" font-family="Arial,sans-serif" font-size="15" fill="#252525" >Mark it inactive to retire it. Stock changes are always kept as history.</text><rect x="95" y="535" width="280" height="42" fill="#e3e3e3" stroke="#777" /><text x="235.0" y="562.0" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Confirm mark inactive</text><rect x="410" y="535" width="280" height="42" fill="#e3e3e3" stroke="#777" /><text x="550.0" y="562.0" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Cancel and keep material</text><text x="95" y="610" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Delete unavailable — disabled ]</text><text x="95" y="642" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Only materials with zero stock, no product links, and no stock history can be deleted.</text><text x="35" y="790" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Low-fidelity wireframe. Bracketed content is a field or action. Rules follow the proposal and DB/data-dictionary.md.</text></svg>