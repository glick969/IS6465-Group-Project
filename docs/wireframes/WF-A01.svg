<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="WF-A01 Login"><rect width="100%" height="100%" fill="white"/><text x="35" y="37" font-family="Arial,sans-serif" font-size="23" fill="#252525" >WF-A01  Login</text><text x="35" y="65" font-family="Arial,sans-serif" font-size="13" fill="#252525" >UC-A01 supporting use case • General error message • Attempt limit • Role-based landing page</text><rect x="35" y="90" width="1130" height="660" fill="#fafafa" stroke="#777" /><rect x="35" y="90" width="1130" height="62" fill="#eee" stroke="#777" /><text x="60" y="128" font-family="Arial,sans-serif" font-size="18" fill="#252525" >KITTEN FACTORY</text><text x="460" y="128" font-family="Arial,sans-serif" font-size="15" fill="#252525" >Home    Products    Customer catalog    Raw materials    Login</text><text x="60" y="179" font-family="Arial,sans-serif" font-size="12" fill="#252525" >MIDTERM PROTOTYPE / FICTIONAL DATA / NO DATABASE</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="26" fill="#252525" >Sign in to the workshop</text><text x="65" y="247" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Employees and administrators manage products and materials. Customers browse the catalog.</text><rect x="65" y="265" width="690" height="420" fill="#fff" stroke="#777" /><text x="95" y="305" font-family="Arial,sans-serif" font-size="20" fill="#252525" >Sign in</text><rect x="95" y="322" width="630" height="40" fill="#eee" stroke="#777" /><text x="110" y="347" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Error area: "The email or password is incorrect." (one general message)</text><text x="95" y="395" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Email address</text><rect x="95" y="403" width="630" height="38" fill="#fff" stroke="#777" /><text x="107" y="428" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ name@example.com ]</text><text x="95" y="470" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Password</text><rect x="95" y="478" width="520" height="38" fill="#fff" stroke="#777" /><text x="107" y="503" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Password, hidden ]</text><rect x="625" y="478" width="100" height="38" fill="#e3e3e3" stroke="#777" /><text x="675.0" y="503.0" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Show</text><rect x="95" y="545" width="200" height="42" fill="#e3e3e3" stroke="#777" /><text x="195.0" y="572.0" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Sign in</text><rect x="320" y="545" width="160" height="42" fill="#e3e3e3" stroke="#777" /><text x="400.0" y="572.0" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Cancel</text><text x="95" y="625" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Forgot password: contact a workshop administrator (reset planned for the final system).</text><text x="95" y="650" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Required-field and email-format errors appear beside each field.</text><rect x="800" y="270" width="330" height="400" fill="#f1f1f1" stroke="#777" /><text x="820" y="300" font-family="Arial,sans-serif" font-size="16" fill="#252525" >Demo accounts (fictional)</text><text x="820" y="330" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Employee / Admin / Customer</text><text x="820" y="355" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Sample emails and password ]</text><text x="820" y="425" font-family="Arial,sans-serif" font-size="16" fill="#252525" >Rules</text><text x="820" y="455" font-family="Arial,sans-serif" font-size="14" fill="#252525" >5 failed attempts: pause 30 s</text><text x="820" y="480" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Do not reveal which accounts exist</text><text x="820" y="505" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Employee / Admin go to</text><text x="820" y="530" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Raw materials</text><text x="820" y="555" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Customer goes to the catalog</text><text x="820" y="600" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Final system: hashed passwords</text><text x="820" y="622" font-family="Arial,sans-serif" font-size="13" fill="#252525" >checked on the server with</text><text x="820" y="644" font-family="Arial,sans-serif" font-size="13" fill="#252525" >PHP sessions</text><text x="35" y="790" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Low-fidelity wireframe. Bracketed content is a field or action. Rules follow the proposal and DB/data-dictionary.md.</text></svg>