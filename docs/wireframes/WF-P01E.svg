<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="WF-P01E Validation error state"><rect width="100%" height="100%" fill="white"/><text x="35" y="37" font-family="Arial,sans-serif" font-size="23" fill="#252525" >WF-P01E  Validation error state</text><text x="35" y="65" font-family="Arial,sans-serif" font-size="13" fill="#252525" >UC-P01 / UC-P03 • FR-P06 • Retain entries and identify invalid fields</text><rect x="35" y="90" width="1130" height="660" fill="#fafafa" stroke="#777" /><rect x="35" y="90" width="1130" height="62" fill="#eee" stroke="#777" /><text x="60" y="128" font-family="Arial,sans-serif" font-size="18" fill="#252525" >KITTEN FACTORY</text><text x="460" y="128" font-family="Arial,sans-serif" font-size="15" fill="#252525" >Home    Products    Customer catalog    Raw materials    Login</text><text x="60" y="179" font-family="Arial,sans-serif" font-size="12" fill="#252525" >MIDTERM PROTOTYPE / FICTIONAL DATA / NO DATABASE</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="26" fill="#252525" >Add product</text><text x="65" y="247" font-family="Arial,sans-serif" font-size="13" fill="#252525" >All fields required. ID assigned automatically; retained during editing.</text><rect x="65" y="262" width="690" height="54" fill="#eee" stroke="#777" /><text x="80" y="284" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Please correct the highlighted fields. Your entries are retained.</text><text x="80" y="305" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Stock must be a nonnegative whole number of pairs.</text><text x="65" y="345" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Product name</text><rect x="65" y="353" width="690" height="38" fill="#fff" stroke="#777" /><text x="77" y="378" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Product name ]</text><text x="65" y="420" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Ski type</text><rect x="65" y="428" width="330" height="38" fill="#fff" stroke="#777" /><text x="77" y="453" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Park / Powder / Touring ]</text><text x="425" y="420" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Size in cm</text><rect x="425" y="428" width="330" height="38" fill="#fff" stroke="#777" /><text x="437" y="453" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Positive whole centimeters ]</text><text x="65" y="495" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Construction</text><rect x="65" y="503" width="690" height="38" fill="#fff" stroke="#777" /><text x="77" y="528" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Full carbon / Hybrid ]</text><text x="65" y="570" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Selling price in USD</text><rect x="65" y="578" width="330" height="38" fill="#fff" stroke="#777" /><text x="77" y="603" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Nonnegative amount ]</text><text x="425" y="570" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Manufacturing cost in USD</text><rect x="425" y="578" width="330" height="38" fill="#fff" stroke="#777" /><text x="437" y="603" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Internal cost ]</text><text x="65" y="645" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Finished stock in pairs</text><rect x="65" y="653" width="330" height="38" fill="#fff" stroke="#777" /><text x="77" y="678" font-family="Arial,sans-serif" font-size="14" fill="#252525" >-1.5</text><text x="425" y="645" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Responsible employee</text><rect x="425" y="653" width="330" height="38" fill="#fff" stroke="#777" /><text x="437" y="678" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Select employee ]</text><rect x="800" y="270" width="330" height="400" fill="#f1f1f1" stroke="#777" /><text x="820" y="300" font-family="Arial,sans-serif" font-size="16" fill="#252525" >Status</text><text x="820" y="330" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Product status</text><rect x="820" y="338" width="285" height="38" fill="#fff" stroke="#777" /><text x="832" y="363" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Active / Inactive ]</text><text x="820" y="425" font-family="Arial,sans-serif" font-size="16" fill="#252525" >Rules</text><text x="820" y="455" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Price / cost &gt;= 0</text><text x="820" y="480" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Stock: whole pairs &gt;= 0</text><text x="820" y="505" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Internal cost stays staff only</text><text x="820" y="530" font-family="Arial,sans-serif" font-size="14" fill="#252525" >Keep historical order prices</text><text x="820" y="555" font-family="Arial,sans-serif" font-size="14" fill="#252525" >when current price changes</text><rect x="820" y="590" width="285" height="42" fill="#e3e3e3" stroke="#777" /><text x="962.5" y="617" font-family="Arial,sans-serif" font-size="14" fill="#252525" text-anchor="middle">Add product</text><text x="830" y="655" font-family="Arial,sans-serif" font-size="14" fill="#252525" >[ Cancel without saving ]</text><text x="35" y="790" font-family="Arial,sans-serif" font-size="13" fill="#252525" >Low-fidelity wireframe. Bracketed content is a field or action. See the requirements template for FR / BR / AT links.</text></svg>