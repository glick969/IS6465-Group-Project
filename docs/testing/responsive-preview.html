<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive prototype review</title><style>body{margin:20px;background:#e9ece6;color:#243e31;font:15px/1.5 Arial,sans-serif}iframe{display:block;border:1px solid #98a595;background:white;width:390px;height:900px}label{display:inline-block;margin:15px 12px 15px 0}select{font:inherit;padding:8px}h1{font-size:22px}p{max-width:80ch}</style></head><body><h1>Responsive prototype review</h1><p>The frame renders the actual application at the selected viewport width. It shares the fictional session data with the prototype.</p><label for="screen">Screen <select id="screen"><option value="../../index.php">Home</option><option value="../../security/login.php">Login</option><option value="../../products/index.php">Product list</option><option value="../../products/create.php">Add product</option><option value="../../products/view.php?id=P1001">Product details</option><option value="../../products/edit.php?id=P1001">Edit product</option><option value="../../products/delete.php?id=P1002">Delete product</option><option value="../../products/catalog.php">Customer catalog</option><option value="../../materials/index.php">Material list</option><option value="../../materials/create.php">Add material</option><option value="../../materials/view.php?id=M2001">Material details</option><option value="../../materials/edit.php?id=M2003">Edit material</option><option value="../../materials/delete.php?id=M2006">Delete material</option></select></label><label for="width">Viewport width <select id="width"><option value="390">390 px mobile</option><option value="768">768 px tablet</option><option value="1280">1280 px desktop</option></select></label><p id="layout-status" role="status">Loading layout measurements</p><iframe id="preview" src="../../index.php" title="Responsive application preview"></iframe><script>const frame=document.getElementById('preview');const status=document.getElementById('layout-status');function measure(){const d=frame.contentDocument;if(!d||!d.querySelector('h1'))return;status.textContent=JSON.stringify({screen:document.getElementById('screen').selectedOptions[0].textContent,path:new URL(frame.src).pathname,width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,heading:d.querySelector('h1').textContent,overflow:Array.from(d.querySelectorAll('main *')).filter(e=>(!e.closest('.table-wrap')||e.matches('.table-wrap'))&&!e.closest('dialog')&&e.getBoundingClientRect().right>d.documentElement.clientWidth+1).slice(0,8).map(e=>({tag:e.tagName,id:e.id,class:e.className,width:Math.round(e.getBoundingClientRect().width)}))});}frame.addEventListener('load',measure);document.getElementById('screen').addEventListener('change',function(){status.textContent='Loading '+this.selectedOptions[0].textContent;frame.src=this.value;});document.getElementById('width').addEventListener('change',function(){frame.style.width=this.value+'px';requestAnimationFrame(measure);});measure();</script></body></html>
